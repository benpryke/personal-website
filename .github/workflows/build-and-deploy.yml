name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs Vite+, the Node version in .node-version and the pnpm version
      # in package.json, then the dependencies
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true

      - name: Lint
        run: vp exec biome ci .

      - name: Typecheck
        run: vp run typecheck

      - name: Test
        run: vp run test

      - name: Build
        run: vp run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: master
          folder: dist
          token: ${{ secrets.DEPLOY_TOKEN }}
          repository-name: benpryke/benpryke.github.io
